<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="roadmap-title roadmap-desc">
  <title id="roadmap-title">AI Agent 三个月学习路线图</title>
  <desc id="roadmap-desc">路线图展示 AI Agent 学习从基础闭环、可靠能力、产品化到作品集与框架学习的阶段节奏。</desc>

  <rect x="0" y="0" width="1200" height="720" rx="24" fill="#f8fafc"/>

  <text x="600" y="56" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#172033">AI Agent 三个月学习路线图</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#64748b">阶段节奏、核心能力和 Parenting Copilot 产物递进</text>

  <line x1="142" y1="188" x2="1048" y2="188" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
  <line x1="142" y1="188" x2="1048" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <polygon points="1052,188 1032,176 1032,200" fill="#64748b"/>

  <circle cx="142" cy="188" r="28" fill="#dbeafe" stroke="#f8fafc" stroke-width="5"/>
  <text x="142" y="195" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#172033">1</text>

  <circle cx="410" cy="188" r="28" fill="#fef3c7" stroke="#f8fafc" stroke-width="5"/>
  <text x="410" y="195" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#172033">2</text>

  <circle cx="680" cy="188" r="28" fill="#ede9fe" stroke="#f8fafc" stroke-width="5"/>
  <text x="680" y="195" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#172033">3</text>

  <circle cx="948" cy="188" r="28" fill="#fee2e2" stroke="#f8fafc" stroke-width="5"/>
  <text x="948" y="195" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#172033">4</text>

  <rect x="56" y="262" width="250" height="250" rx="18" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="181" y="302" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#172033">Month 1</text>
  <text x="181" y="334" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#172033">Agent 基础闭环</text>
  <text x="181" y="374" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">LLM 调用</text>
  <text x="181" y="404" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">Prompt 与结构化输出</text>
  <text x="181" y="434" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">Intent Router / 追问</text>
  <text x="181" y="464" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">最小 Agent Loop / Tools</text>

  <rect x="342" y="262" width="250" height="250" rx="18" fill="#fef3c7" stroke="#facc15" stroke-width="1.5"/>
  <text x="467" y="302" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#172033">Month 2</text>
  <text x="467" y="334" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#172033">可靠 Agent 核心</text>
  <text x="467" y="374" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">Memory 长期记忆</text>
  <text x="467" y="404" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">RAG 与知识库</text>
  <text x="467" y="434" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">Evaluation 评估集</text>
  <text x="467" y="464" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">Safety &amp; Trust</text>

  <rect x="628" y="262" width="250" height="250" rx="18" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="753" y="302" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#172033">Month 3</text>
  <text x="753" y="334" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#172033">产品化</text>
  <text x="753" y="374" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">Backend Service</text>
  <text x="753" y="404" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">Android Integration</text>
  <text x="753" y="434" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">MVP Workflow</text>
  <text x="753" y="464" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">真实使用反馈</text>

  <rect x="914" y="262" width="230" height="250" rx="18" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="1029" y="302" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#172033">之后</text>
  <text x="1029" y="334" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#172033">作品集与框架</text>
  <text x="1029" y="374" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">LangGraph 等框架</text>
  <text x="1029" y="404" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">架构文档</text>
  <text x="1029" y="434" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">演示案例</text>
  <text x="1029" y="464" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">公开表达素材</text>

  <rect x="190" y="572" width="820" height="72" rx="20" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.5"/>
  <text x="600" y="616" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#172033">每一阶段都产出可运行、可验证、可复盘的 Parenting Copilot 能力</text>
</svg>
