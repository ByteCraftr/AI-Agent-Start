<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Parenting Copilot Agent 架构视角图</title><desc id="desc">架构视角图从用户与产品层、Agent 编排层、决策层、能力层、基础设施层展示模块边界。</desc>
<defs>
  <style>
    .bg{fill:#f8fafc}.title{font:700 26px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.sub{font:400 14px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#64748b}.label{font:700 16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.small{font:400 13px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}.node{stroke:#cbd5e1;stroke-width:1.3}.core{fill:#dbeafe}.flow{fill:#dcfce7}.reliable{fill:#fef3c7}.safety{fill:#fee2e2}.product{fill:#ede9fe}.muted{fill:#e2e8f0}.root{fill:#ccfbf1;stroke:#5eead4}.line{stroke:#64748b;stroke-width:2.2;fill:none}.soft{stroke:#cbd5e1;stroke-width:1.4;fill:none}.band{fill:#ffffff;stroke:#d7dee8;stroke-width:1.4}.badge{fill:#f1f5f9;stroke:#d7dee8;stroke-width:1}.dot{stroke:#f8fafc;stroke-width:4}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
</defs>
<rect class="bg" width="1200" height="760" rx="24"/>
<text class="title" x="600" y="54" text-anchor="middle">Parenting Copilot Agent 架构视角图</text>
<text class="sub" x="600" y="82" text-anchor="middle">把学习内容映射到模块边界、责任分配和后续可维护性</text>
<rect class="band" x="62" y="116" width="1076" height="94" rx="18"/><text class="label" x="105" y="170">用户与产品层</text><rect class="node product" x="300" y="140" width="140" height="46" rx="12"/><text x="370" y="168" text-anchor="middle" class="small">家长问题</text><rect class="node product" x="478" y="140" width="140" height="46" rx="12"/><text x="548" y="168" text-anchor="middle" class="small">孩子画像</text><rect class="node product" x="656" y="140" width="140" height="46" rx="12"/><text x="726" y="168" text-anchor="middle" class="small">观察计划</text><rect class="node product" x="834" y="140" width="140" height="46" rx="12"/><text x="904" y="168" text-anchor="middle" class="small">反馈闭环</text>
<path class="line" d="M600 212 V246" marker-end="url(#arrow)"/>
<rect class="band" x="62" y="250" width="1076" height="94" rx="18"/><text class="label" x="105" y="304">Agent 编排层</text><rect class="node root" x="312" y="274" width="190" height="46" rx="12"/><text x="407" y="302" text-anchor="middle" class="small">advisor.py</text><rect class="node root" x="534" y="274" width="210" height="46" rx="12"/><text x="639" y="302" text-anchor="middle" class="small">ParentingAgent.run</text><rect class="node root" x="776" y="274" width="154" height="46" rx="12"/><text x="853" y="302" text-anchor="middle" class="small">state machine</text>
<path class="line" d="M600 346 V380" marker-end="url(#arrow)"/>
<rect class="band" x="62" y="384" width="1076" height="106" rx="18"/><text class="label" x="105" y="445">决策层</text><rect class="node flow" x="250" y="410" width="160" height="52" rx="12"/><text x="330" y="441" text-anchor="middle" class="small">intent router</text><rect class="node flow" x="444" y="410" width="210" height="52" rx="12"/><text x="549" y="441" text-anchor="middle" class="small">context sufficiency</text><rect class="node safety" x="688" y="410" width="180" height="52" rx="12"/><text x="778" y="441" text-anchor="middle" class="small">safety classifier</text><rect class="node flow" x="902" y="410" width="122" height="52" rx="12"/><text x="963" y="441" text-anchor="middle" class="small">next action</text>
<path class="line" d="M600 492 V526" marker-end="url(#arrow)"/>
<rect class="band" x="62" y="530" width="1076" height="106" rx="18"/><text class="label" x="105" y="591">能力层</text><rect class="node core" x="246" y="556" width="164" height="52" rx="12"/><text x="328" y="587" text-anchor="middle" class="small">prompt templates</text><rect class="node core" x="438" y="556" width="170" height="52" rx="12"/><text x="523" y="587" text-anchor="middle" class="small">structured output</text><rect class="node reliable" x="636" y="556" width="120" height="52" rx="12"/><text x="696" y="587" text-anchor="middle" class="small">tools</text><rect class="node reliable" x="784" y="556" width="112" height="52" rx="12"/><text x="840" y="587" text-anchor="middle" class="small">memory</text><rect class="node reliable" x="924" y="556" width="86" height="52" rx="12"/><text x="967" y="587" text-anchor="middle" class="small">RAG</text>
<path class="line" d="M600 638 V670" marker-end="url(#arrow)"/>
<rect class="band" x="62" y="674" width="1076" height="56" rx="18"/><text class="label" x="105" y="708">基础设施层</text><rect class="node muted" x="280" y="685" width="126" height="34" rx="10"/><text class="small" x="343" y="707" text-anchor="middle">llm client</text><rect class="node muted" x="438" y="685" width="126" height="34" rx="10"/><text class="small" x="501" y="707" text-anchor="middle">validation</text><rect class="node muted" x="596" y="685" width="126" height="34" rx="10"/><text class="small" x="659" y="707" text-anchor="middle">logging</text><rect class="node muted" x="754" y="685" width="126" height="34" rx="10"/><text class="small" x="817" y="707" text-anchor="middle">eval runner</text><rect class="node muted" x="912" y="685" width="100" height="34" rx="10"/><text class="small" x="962" y="707" text-anchor="middle">storage</text>
</svg>
